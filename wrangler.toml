name = "zuey-me"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "zuey_me_db"
database_id = "01a32241-371e-4e12-b848-2e8bcba189c4"

# Environment variables
[vars]
PUBLIC_SITE_URL = "https://zuey.me"
PUBLIC_POSTHOG_KEY = "phc_zTPJwFiZZekHoxSj5PRg8ey4Ja7sKL7GXEGxjSKtZMPk"
PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"

# Workers AI binding (Zuey Reads summaries)
[ai]
binding = "AI"

# Private R2 bucket for referral payout national-ID images (no public domain).
# Objects live only until an admin approves or rejects the payout profile.
[[r2_buckets]]
binding = "REFERRAL_KYC"
bucket_name = "zuey-referral-kyc"

# Private course audio and downloads; the bucket stays private (no public access).
[[r2_buckets]]
binding = "COURSE_FILES"
bucket_name = "zuey-course-files"
