# Cron Trigger worker for zuey.me (Cloudflare Pages has no cron). CI deploys it on push to main
# (.github/workflows/deploy.yml); do not deploy it by hand. One-time secret, kept across deploys:
#   wrangler secret put CRON_SECRET --config workers/scheduler/wrangler.toml   # same value as the Pages secret
name = "zuey-me-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
# Every 5 minutes: due new-article emails go out within ~5 minutes of their 30-minute delay.
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://zuey.me"

[observability]
enabled = true
