name: Membership renewal reminders

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Saigon
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger /api/v1/billing/reminders
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zuey.me' }}
          ZUEY_ADMIN_API_KEY: ${{ secrets.ZUEY_ADMIN_API_KEY }}
        run: |
          curl -fsS --max-time 300 -X POST "$SITE_URL/api/v1/billing/reminders" -H "Authorization: Bearer $ZUEY_ADMIN_API_KEY"
