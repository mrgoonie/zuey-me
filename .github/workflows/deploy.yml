name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The only sanctioned way to redeploy production without a new commit: run this
  # workflow on main from the Actions tab (or `gh workflow run deploy.yml --ref main`).
  workflow_dispatch:

# Production deploys run one at a time in commit order, so an older build can never
# finish after a newer one and overwrite it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Test Suite
        run: bun test

      - name: Build Application
        run: bun run build

      - name: Deploy to Cloudflare Pages (Production)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The commit hash ties each Cloudflare deployment to the main commit it was built from.
          command: pages deploy dist --project-name=zuey-me --branch=main --commit-hash=${{ github.sha }}
