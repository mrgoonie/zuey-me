name: Zuey Reads sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger /api/v1/reads/sync
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://zuey.me' }}
        run: |
          # Batch the sync so each request stays well under Cloudflare's ~100s origin timeout (524).
          offset=0
          while :; do
            body=$(curl -fsS --max-time 120 --retry 2 --retry-all-errors -X POST "$SITE_URL/api/v1/reads/sync" -H "Authorization: Bearer ${{ secrets.ZUEY_ADMIN_API_KEY }}" -H "Content-Type: application/json" -d "{\"offset\":$offset,\"limit\":5}")
            echo "$body"
            offset=$(echo "$body" | jq -r '.data.next_offset')
            [ "$offset" = "null" ] && break
          done
